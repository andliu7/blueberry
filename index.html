<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Just the name. It was "Blueberry - CHEM 242 flashcards", which was
         written when the site was one course's flashcards and is now both wrong
         and too long to survive a browser tab: what you actually see on a
         crowded tab strip is "Blueberry - CH...". The lowercase matches the
         wordmark on the opening screen. -->
    <title>blueberry</title>
    <meta
      name="description"
      content="Free organic chemistry flashcard decks for the CHEM 242 lab critical thinking assessments, plus pKa, IR and NMR reference sheets. Flip, drill and rate yourself."
    />
    <!-- The site spreads by people pasting the link into GroupMe and Discord,
         and without these that paste previews as a bare URL. Absolute URLs
         because Open Graph crawlers do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blueberry — CHEM 242 flashcards" />
    <meta
      property="og:description"
      content="Organic chemistry flashcards for the CHEM 242 LCTAs, plus pKa, IR and NMR reference sheets."
    />
    <meta property="og:url" content="https://andliu7.github.io/blueberry/" />
    <meta property="og:image" content="https://andliu7.github.io/blueberry/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <!-- Matches the dark surface in lib/hubSurface, so mobile browser chrome
         does not sit as a white band above a dark page. -->
    <meta name="theme-color" content="#171327" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9ff" media="(prefers-color-scheme: light)" />
    <script>
      window.MathJax = { tex: { inlineMath: [['$', '$']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
      // Applies the saved theme before first paint. Doing this in React instead
      // would show a flash of the light theme on every load for dark users.
      (function () {
        try {
          // Dark unless the visitor has explicitly chosen light before. The OS
          // preference is deliberately not consulted, so the first impression is
          // the same for everyone.
          var saved = localStorage.getItem('theme');
          document.documentElement.classList.toggle('dark', saved !== 'light');
          // The entry gate's second setting, applied here for the same reason
          // as the first: a framed visitor should never see one unframed paint.
          if (localStorage.getItem('device-frame') === 'on') {
            document.documentElement.setAttribute('data-device-frame', '');
          }
        } catch (e) {}
      })();
    </script>
    <!-- THE DISPLAY FACE, loaded because it was never loaded before.
         --font-display named ui-rounded, SF Pro Rounded, Arial Rounded MT Bold,
         Baloo 2, Quicksand and Varela Round, and NOTHING in this repo fetched
         any of them. The first two are Apple only, the last three are Google
         Fonts nobody linked, so the stack fell through per machine: a visitor
         with Office got Arial Rounded MT Bold, a bold-only family that ignores
         font-weight, and everyone else got system-ui, which is the same face as
         the body text. The wordmark therefore rendered differently for the
         owner than for his users, and for most of them had no display face at
         all. That is the bug; the typeface below is one token away from being
         swapped if the choice is wrong.

         Nunito: rounded terminals so it sits with a blueberry, a real weight
         range unlike the bold-only Arial, and it reads as a study tool rather
         than a children's app. display=swap so the text paints immediately in
         the fallback and never blocks first render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
