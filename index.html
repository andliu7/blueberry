    <script>
      // Applies the saved theme before first paint. Doing this in React instead
      // would show a flash of the light theme on every load for dark users.
      (function () {
        try {
          // Light unless the visitor has explicitly chosen dark before. The OS
          // preference is deliberately not consulted: this reads as a paper
          // study sheet, and first impressions should match that.
          var saved = localStorage.getItem('theme');
          document.documentElement.classList.toggle('dark', saved === 'dark');
        } catch (e) {}
      })();
    </script>
