    <!-- Just the name. It was "Blueberry - CHEM 242 flashcards", which was
         written when the site was one course's flashcards and is now both wrong
         and too long to survive a browser tab: what you actually see on a
         crowded tab strip is "Blueberry - CH...". The lowercase matches the
         wordmark on the opening screen. -->
    <title>blueberry</title>
    <meta
      name="description"
      content="Free organic chemistry flashcard decks for the CHEM 242 lab critical thinking assessments, plus pKa, IR and NMR reference sheets. Flip, drill and rate yourself."
    />
    <!-- The site spreads by people pasting the link into GroupMe and Discord,
         and without these that paste previews as a bare URL. Absolute URLs
         because Open Graph crawlers do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blueberry — CHEM 242 flashcards" />
    <meta
      property="og:description"
      content="Organic chemistry flashcards for the CHEM 242 LCTAs, plus pKa, IR and NMR reference sheets."
    />
    <meta property="og:url" content="https://andliu7.github.io/blueberry/" />
    <meta property="og:image" content="https://andliu7.github.io/blueberry/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <!-- Matches the site ground, --site-ground in src/tokens.css, so mobile
         browser chrome does not sit as a different band above the page. -->
    <meta name="theme-color" content="#101827" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efeaf8" media="(prefers-color-scheme: light)" />
    <script>
      // Applies the saved theme before first paint. Doing this in React instead
      // would show a flash of the light theme on every load for dark users.
      (function () {
        try {
          // Dark unless the visitor has explicitly chosen light before. The OS
          // preference is deliberately not consulted, so the first impression is
          // the same for everyone.
          var saved = localStorage.getItem('theme');
          document.documentElement.classList.toggle('dark', saved !== 'light');
          // The entry gate's second setting, applied here for the same reason
          // as the first: a framed visitor should never see one unframed paint.
          if (localStorage.getItem('device-frame') === 'on') {
            document.documentElement.setAttribute('data-device-frame', '');
          }
        } catch (e) {}
        // The game's front door (#boot, in the body) is shown on the way into
        // #/app. Set before paint on a cold open, so its first frame is the
        // loader and no other page ever shows a frame of it.
        if (/^#\/app(?:[\/?]|$)/.test(location.hash)) {
          document.documentElement.setAttribute('data-boot', '');
        }
        // Reduced motion is one attribute (src/tokens.css), read by CSS and by
        // isReducedMotion() in src/lib/motionPref.ts. Set here, before paint, so
        // a hidden entry state never flashes for someone who asked for less motion.
        // The footer's switch saves "reduced" or "full"; with no saved choice the OS
        // setting decides.
        try {
          var motion = localStorage.getItem('motion');
          if (motion === 'reduced' || (motion !== 'full' && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
            document.documentElement.setAttribute('data-motion', 'reduced');
          }
        } catch (e) {}
      })();
    </script>

    <script>
      // Drives #boot: the count, the handoff, and the warm open from inside the
      // site. Loader.tsx reports the two milestones only the game knows and
      // explains the rest.
      (function () {
        var d = document.documentElement, el = document.getElementById('boot'), root = document.getElementById('root');
        if (!el || !root) return;
        var APP = /^#\/app(?:[\/?]|$)/, P = window.performance;
        var MIN_MS = 900, CAP_MS = 15000, HOLD_MS = 200, FLY_MS = 640, LIFT_AT = 90, LIFT_MS = 520, ROW = 1;
        // A load whose app was ready inside FAST_MS gets a shorter reveal: settle, run to 100,
        // hold and fade all shrink, Bloom's flight stays. On good wifi the full ceremony
        // was longer than the load itself (owner picked this, 2026-10-16).
        var FAST_MS = 1500, quick = false;
        var QUICK_MS = 80, SLOW_MIN = 250, SLOW_MAX = 700;
        var ORDER = ['parsed', 'entry', 'game', 'ready', 'settled'];
        var W = { parsed: 5, entry: 25, game: 30, ready: 30, settled: 10 };
        var FIRST_WORD = 'Getting ready';
        var hold = /[?&]boot=hold(?:&|$)/.test(location.search);
        var strip = document.getElementById('boot-strip'), word = document.getElementById('boot-word'), slow = document.getElementById('boot-slow');
        var meter = el.querySelector('[role="progressbar"]');
        var rows = '';
        for (var i = 0; i <= 100; i++) rows += '<span>' + i + '</span>';
        strip.innerHTML = rows;
        var up = false, run = 0, got = {}, finished = false, closing = false, capped = false, middle = '', live = false, reduced = false;
        var anim = null, segs = [], planAt = 0, at = 0, t0 = 0, ariaTimer = 0, capTimer = 0, seen = 0, base = 0, bump = 0;
        var entered = document.readyState !== 'loading';
        function wordFor(v) {
          if (v >= 100) return 'Ready';
          if (v >= 90) return 'Almost there';
          if (capped) return 'Slow connection, still loading';
          if (v >= 60) return middle || FIRST_WORD;
          return FIRST_WORD;
        }
        function say(v) {
          var w = wordFor(v);
          if (word.textContent !== w) word.textContent = w;
          meter.setAttribute('aria-valuenow', String(v));
          meter.setAttribute('aria-valuetext', v + ' percent, ' + w);
        }
        function paint(v) { strip.style.transform = 'translateY(' + -ROW * v + 'em)'; }
        function current() {
          if (!anim) return at;
          var t = P.now() - planAt, v = at;
          for (var i = 0; i < segs.length; i++) {
            var s = segs[i];
            if (t < s.ms) return v + Math.floor((s.to - v) * t / s.ms);
            t -= s.ms; v = s.to;
          }
          return v;
        }
        function stop() {
          var v = current();
          if (anim) anim.cancel();
          anim = null; segs = []; at = v; paint(v);
          return v;
        }
        function animate(out, done) {
          var total = 0, keys = [], time = 0, from = at;
          for (var i = 0; i < out.length; i++) total += out[i].ms;
          for (i = 0; i <= out.length; i++) {
            var val = i === 0 ? from : out[i - 1].to, k = { offset: time / total, transform: 'translateY(' + -ROW * val + 'em)' };
            if (i < out.length) { k.easing = 'steps(' + (out[i].to - val) + ', end)'; time += out[i].ms; }
            keys.push(k);
          }
          segs = out; planAt = P.now();
          anim = strip.animate(keys, { duration: total, fill: 'forwards' });
          if (done) anim.onfinish = done;
        }
        function plan(fromFiles) {
          if (closing) return;
          var sum = 0, next = 0;
          for (var i = 0; i < ORDER.length; i++) {
            if (got[ORDER[i]]) sum += W[ORDER[i]]; else if (!next) next = W[ORDER[i]];
          }
          var top = sum + next - 1;
          var low = Math.min(top, sum + Math.floor(next * 0.5 * (1 - Math.exp((base - seen) / 40))));
          if (fromFiles && live && low <= current()) return;
          var v = stop();
          if (!live) { at = Math.max(v, sum); paint(at); say(at); if (sum >= 100) finish(); return; }
          say(v);
          var out = [];
          if (sum >= 100) {
            if (v < 100) out.push({ to: 100, ms: quick ? Math.min(200, (100 - v) * 8) : Math.min(400, (100 - v) * 15) });
          } else {
            var from = v, spent = 0;
            if (low > from) { out.push({ to: low, ms: Math.min(500, (low - from) * 25) }); spent += out[out.length - 1].ms; from = low; }
            var quick = Math.min(top, sum + Math.floor(next * 0.4));
            if (quick > from) { out.push({ to: quick, ms: (quick - from) * QUICK_MS }); spent += out[out.length - 1].ms; from = quick; }
            if (top > from) {
              var left = t0 + (capped ? 2 : 1) * CAP_MS - P.now() - spent;
              var unit = Math.max(SLOW_MIN, Math.min(SLOW_MAX, left / (top - from)));
              out.push({ to: top, ms: (top - from) * unit });
            }
          }
          if (!out.length) { if (sum >= 100) finish(); return; }
          animate(out, sum >= 100 ? finish : null);
        }
        function finish() {
          if (finished || hold) return;
          finished = true;
          var mine = run;
          setTimeout(function () { if (run === mine) reveal(); }, Math.max(quick ? 0 : HOLD_MS, MIN_MS - (P.now() - t0)));
        }
        function free() {
          root.inert = false;
          root.removeAttribute('aria-hidden');
        }
        function close(shown) {
          up = false; closing = false; run++; stop();
          clearInterval(ariaTimer); clearTimeout(capTimer);
          d.removeAttribute('data-boot'); el.removeAttribute('data-boot'); el.removeAttribute('data-carried'); el.removeAttribute('data-quick'); el.removeAttribute('data-lift');
          var hop = el.querySelector('.boot-hop'), mark = document.getElementById('boot-mark');
          hop.style.animation = hop.style.transform = mark.style.animation = mark.style.transform = mark.style.filter = '';
          if (stand) { stand.style.opacity = ''; stand = null; }
          free();
          if (shown && el.parentNode) el.parentNode.removeChild(el);
          window.dispatchEvent(new Event('blueberry:boot-gone'));
        }
        function reveal(force) {
          if (!up || closing) return;
          var mine = run;
          if (!force && !shown()) { setTimeout(function () { if (run === mine) reveal(); }, 100); return; }
          closing = true;
          clearInterval(ariaTimer); clearTimeout(capTimer);
          var v = stop();
          if (v >= 100 || !live) { at = 100; paint(100); say(100); handoff(mine); return; }
          animate([{ to: 100, ms: Math.min(700, (100 - v) * 20) }], function () {
            say(100);
            setTimeout(function () { handoff(mine); }, quick ? 0 : HOLD_MS);
          });
        }
        function bloomTarget() {
          var list = root.querySelectorAll('.berry-origin'), best = null, area = 0;
          for (var i = 0; i < list.length; i++) {
            var r = list[i].getBoundingClientRect();
            if (r.width < 36 || r.bottom <= 0 || r.right <= 0 || r.top >= innerHeight || r.left >= innerWidth) continue;
            if (getComputedStyle(list[i]).visibility === 'hidden') continue;
            if (r.width * r.height > area) { area = r.width * r.height; best = list[i]; }
          }
          return best;
        }
        function body(node) {
          var c = node.querySelector('circle[r="23"][fill^="url"]'), was = node.style.transform;
          node.style.transform = 'none';
          var r = (c || node).getBoundingClientRect();
          node.style.transform = was;
          return { x: r.left + r.width / 2, y: r.top + r.height / 2, d: c ? r.width : r.width * 46 / 64 };
        }
        var home = null, stand = null;
        function carry(target) {
          var hop = el.querySelector('.boot-hop'), mark = document.getElementById('boot-mark');
          var hopNow = getComputedStyle(hop).transform, markNow = getComputedStyle(mark).transform;
          hop.style.animation = 'none'; mark.style.animation = 'none';
          hop.style.transform = 'none'; mark.style.transform = 'none';
          var box = hop.getBoundingClientRect();
          home = { cx: box.left + box.width / 2, cy: box.top + box.height / 2, b: body(mark) };
          el.setAttribute('data-carried', ''); el.setAttribute('data-boot', 'carry');
          var t = body(target), s = t.d / home.b.d;
          var x = t.x - home.cx - s * (home.b.x - home.cx), y = t.y - home.cy - s * (home.b.y - home.cy);
          var end = 'translate(' + x + 'px, ' + y + 'px) scale(' + s + ')';
          var peak = Math.min(0, y) - Math.max(56, innerHeight * 0.1);
          hop.style.transform = end;
          // The real mascot waits out of sight until Bloom lands on it, or the lift shows two.
          stand = target; target.style.opacity = '0';
          var ring = getComputedStyle(target).filter;
          mark.style.filter = ring === 'none' ? '' : ring.replace(/(-?[\d.]+)px/g, function (m, n) { return n / s + 'px'; });
          mark.animate([{ transform: markNow === 'none' ? 'none' : markNow }, { transform: 'none' }], { duration: 200, easing: 'ease-out' });
          return hop.animate([
            { transform: hopNow === 'none' ? 'none' : hopNow, easing: 'cubic-bezier(0.2, 0.7, 0.4, 1)' },
            { offset: 0.42, transform: 'translate(' + x * 0.4 + 'px, ' + peak + 'px) scale(' + (1 + s) / 2 + ') rotate(-8deg)', easing: 'cubic-bezier(0.55, 0, 0.85, 0.35)' },
            { transform: end },
          ], { duration: FLY_MS });
        }
        function land() {
          document.getElementById('boot-mark').animate(
            [{ transform: 'scale(1.14, 0.84)' }, { transform: 'scale(0.96, 1.05)', offset: 0.5 }, { transform: 'none' }],
            { duration: 220, easing: 'ease-out' });
        }
        function handoff(mine) {
          if (run !== mine) return;
          free();
          function fade() {
            if (run !== mine) return;
            if (stand) { stand.style.opacity = ''; stand = null; }
            el.setAttribute('data-boot', 'out');
            setTimeout(function () { if (run === mine) close(true); }, (reduced ? 160 : quick ? 160 : 200) + 20);
          }
          if (reduced) { el.offsetWidth; fade(); return; }
          var target = bloomTarget();
          setTimeout(function () { if (run === mine) el.setAttribute('data-lift', ''); }, target ? LIFT_AT : 0);
          if (!target) {
            el.setAttribute('data-boot', 'carry');
            setTimeout(function () { if (run === mine) close(true); }, LIFT_MS + 20);
            return;
          }
          carry(target).onfinish = function () {
            if (run !== mine) return;
            land();
            setTimeout(fade, 220);
          };
        }
        function leave() {
          if (up) close(el.hasAttribute('data-boot'));
        }
        function step(k) {
          if (!up || got[k] || closing) return;
          got[k] = true; base = seen;
          if (k === 'ready') { quick = P.now() - t0 < FAST_MS; if (quick) el.setAttribute('data-quick', ''); settle(); }
          plan();
        }
        function gateUp() { return !!root.querySelector('[aria-busy].fixed.inset-0'); }
        function painted() { return root.childElementCount > 0 && !!root.innerText.trim(); }
        function shown() {
          if (gateUp() || !painted()) return false;
          return !!got.ready || P.now() - t0 > 2 * CAP_MS;
        }
        function settle() {
          var mine = run, start = 0, clear = 0, last = 0, smooth = 0;
          function frame(now) {
            if (run !== mine || got.settled) return;
            if (!start) start = now;
            if (!clear && !gateUp()) clear = now;
            if (clear) { smooth = last && now - last < 25 ? smooth + 1 : 0; last = now; }
            if (clear && (smooth >= 4 || now - clear > (quick ? 150 : 400))) step('settled'); else requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
        }
        function open() {
          if (up) return;
          var again = run > 0;
          up = true; run++; finished = false; closing = false; capped = false; quick = false; middle = ''; anim = null; segs = []; at = 0;
          got = { parsed: true }; if (entered) got.entry = true;
          if (again) at = W.parsed + (entered ? W.entry : 0);
          reduced = d.getAttribute('data-motion') === 'reduced';
          live = typeof strip.animate === 'function';
          t0 = P.now(); base = seen; slow.hidden = true; paint(at); say(at);
          d.setAttribute('data-boot', ''); el.removeAttribute('data-boot');
          root.inert = true; root.setAttribute('aria-hidden', 'true');

          if (!hold) capTimer = setTimeout(function () { capped = true; slow.hidden = false; plan(); reveal(); }, CAP_MS);
          plan();
        }
        try {
          new PerformanceObserver(function (list) {
            seen += list.getEntries().length;
            if (up && !bump) bump = setTimeout(function () { bump = 0; if (up) plan(true); }, 250);
          }).observe({ type: 'resource', buffered: true });
        } catch (e) {}
        window.__blueberryBoot = function (k, text) {
          if (!up) return;
          if (k === 'game' && text) middle = text;
          step(k);
        };
        window.__blueberryBootRelease = function () { hold = false; reveal(true); };
        if (!entered) document.addEventListener('DOMContentLoaded', function () { entered = true; step('entry'); });
        var wasApp = APP.test(location.hash);
        window.addEventListener('hashchange', function () {
          var isApp = APP.test(location.hash);
          if (isApp && !wasApp && el.parentNode) open();
          else if (!isApp) leave();
          wasApp = isApp;
        });
        // A cold open counts its floor from navigation, not from this line.
        if (d.hasAttribute('data-boot')) { open(); t0 = 0; }
      })();
    </script>
