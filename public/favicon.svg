<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Blueberry">
  <title>Blueberry</title>
  <defs>
    <!-- Blue into purple, lit from the upper left so the berry reads as round. -->
    <radialGradient id="berry" cx="33%" cy="27%" r="84%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="28%" stop-color="#4f86f7" />
      <stop offset="66%" stop-color="#6d3fe0" />
      <stop offset="100%" stop-color="#3b1d8f" />
    </radialGradient>
    <!-- Deeper than the berry it sits on. The calyx is the feature that names
         the fruit, so it has to hold at 16px, and a lobe only a shade off the
         body behind it disappears at that size. -->
    <linearGradient id="calyx" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3350d8" />
      <stop offset="100%" stop-color="#1c1668" />
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#6ee7a0" />
    </linearGradient>
    <!-- Painted rather than filtered. A blur filter on a 16px favicon costs more
         than the softness is worth, and a radial fade gives the same read. -->
    <radialGradient id="shade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#475569" stop-opacity="0.17" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0" />
    </radialGradient>
  </defs>

  <ellipse cx="32" cy="59" rx="18" ry="4.8" fill="url(#shade)" />

  <!-- One leaf, sprouting from behind the fruit. Drawn before the berry so the
       berry overlaps its base, which is what makes it read as behind. -->
  <g>
    <path d="M41 24 C46 12.5 53.5 6.5 59 9 C59.5 17 52.5 23.5 41 24 Z" fill="url(#leaf)" />
    <path d="M42.5 23 C47.5 18.6 53.5 13.4 58.2 9.9" fill="none" stroke="#15803d"
          stroke-width="1.1" stroke-linecap="round" opacity="0.5" />
  </g>

  <circle cx="32" cy="36" r="21" fill="url(#berry)" />

  <!-- Kept clear of the calyx. Sitting under a lobe it washed the lobe out and
       read as a smudge rather than as a curved surface. -->
  <ellipse cx="19.5" cy="28" rx="5.6" ry="3.8" fill="#ffffff" opacity="0.26"
           transform="rotate(-30 19.5 28)" />

  <!-- The calyx sits on top of the fruit and points up, which is where a
       blueberry actually wears it. The whole group is squashed vertically: seen
       from the side, a crown lying flat on the top of a sphere is foreshortened,
       and drawing it as a circular star made the berry read as face on. -->
  <g fill="url(#calyx)" transform="translate(32 17) scale(1 0.62)">
    <path d="M0 -11 C2.8 -6.7 3.7 -2.8 2.6 0 C1.6 2.2 -1.6 2.2 -2.6 0 C-3.7 -2.8 -2.8 -6.7 0 -11 Z" />
    <path d="M0 -11 C2.8 -6.7 3.7 -2.8 2.6 0 C1.6 2.2 -1.6 2.2 -2.6 0 C-3.7 -2.8 -2.8 -6.7 0 -11 Z"
          transform="rotate(72)" />
    <path d="M0 -11 C2.8 -6.7 3.7 -2.8 2.6 0 C1.6 2.2 -1.6 2.2 -2.6 0 C-3.7 -2.8 -2.8 -6.7 0 -11 Z"
          transform="rotate(144)" />
    <path d="M0 -11 C2.8 -6.7 3.7 -2.8 2.6 0 C1.6 2.2 -1.6 2.2 -2.6 0 C-3.7 -2.8 -2.8 -6.7 0 -11 Z"
          transform="rotate(216)" />
    <path d="M0 -11 C2.8 -6.7 3.7 -2.8 2.6 0 C1.6 2.2 -1.6 2.2 -2.6 0 C-3.7 -2.8 -2.8 -6.7 0 -11 Z"
          transform="rotate(288)" />
    <circle r="3.6" fill="#241f7a" />
  </g>
</svg>
