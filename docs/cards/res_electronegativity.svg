<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="Electronegativity ranking: F O N Cl Br C S I P H, most to least electronegative">
  <!--
    Dr. Stocker's FONClBrCSIPH mnemonic, drawn as the thing it actually is.

    This row used to borrow res_neutral_example, a drawing of a neutral molecule
    pushing a pi bond, which has nothing to do with an ordering of atoms. A
    periodic table would be closer but still wrong: the mnemonic is not a table,
    it is one ranked line, and the whole point is where an atom sits on it
    relative to its neighbours.

    Drawn rather than photographed so it stays crisp at any zoom and carries no
    printed answer to crop out.
  -->
  <defs>
    <linearGradient id="pull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0.35"/>
    </linearGradient>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="520" height="200" fill="#ffffff"/>

  <text x="260" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#0f172a">
    Electronegativity: who keeps the electrons
  </text>

  <!-- The ranked line. Bar width tracks the ranking, so the shape says the
       same thing as the letters for anyone scanning rather than reading. -->
  <rect x="40" y="52" width="440" height="10" rx="5" fill="url(#pull)"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <text x="52"  y="95" fill="#4338ca">F</text>
    <text x="100" y="95" fill="#4f46e5">O</text>
    <text x="148" y="95" fill="#5b21b6">N</text>
    <text x="200" y="95" fill="#6d28d9">Cl</text>
    <text x="254" y="95" fill="#7c3aed">Br</text>
    <text x="304" y="95" fill="#8b5cf6">C</text>
    <text x="350" y="95" fill="#9333ea">S</text>
    <text x="396" y="95" fill="#a855f7">I</text>
    <text x="440" y="95" fill="#c026d3">P</text>
    <text x="482" y="95" fill="#d8b4fe">H</text>
  </g>

  <!-- C and S sit level on the sheet, which the letters alone cannot show. -->
  <text x="327" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">C &#8776; S</text>

  <line x1="40" y1="140" x2="480" y2="140" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="44"  y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">pulls hardest</text>
  <text x="476" y="160" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">lets go easiest</text>

  <text x="260" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">
    Pushed electrons land on whichever atom is further left.
  </text>
</svg>
