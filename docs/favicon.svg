<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Blueberry">
  <title>Blueberry</title>
  <defs>
    <!-- The site's own indigo into violet, the pair the intro words and the link
         underlines already use, lit from the upper left so the berry reads as
         round rather than as a flat disc. -->
    <radialGradient id="berry" cx="36%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b1d8f" />
    </radialGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="36" r="25" fill="url(#berry)" />

  <!-- Specular highlight, small and off centre. A large one reads as a bauble. -->
  <ellipse cx="23" cy="25" rx="7.5" ry="5.5" fill="#ffffff" opacity="0.26"
           transform="rotate(-28 23 25)" />

  <!-- The calyx. A blueberry's crown is the one feature that keeps a purple
       circle from reading as a grape or a plum, so it is drawn as the five
       point star it actually is rather than as a leaf. -->
  <path fill="url(#crown)"
        d="M32 7 34.8 15.7 43.9 15.7 36.5 21.1 39.4 29.8 32 24.4 24.6 29.8 27.5 21.1 20.1 15.7 29.2 15.7 Z" />
  <circle cx="32" cy="19.6" r="3.9" fill="#4c1d95" opacity="0.5" />
</svg>
