name: Deploy to GitHub Pages

# Build in CI and publish from the artifact, rather than committing a built
# copy of the site into the repository.
#
# `docs/` used to hold that copy. Every publish rewrote roughly 28MB of freshly
# hashed asset filenames, git kept each version forever, and the folder reached
# 132MB -- large enough that a single HTTPS push failed outright with
# `curl 55: Recv failure: Connection was reset`. The site could not be updated
# because the thing being pushed was too big to push.
#
# Building here makes that impossible rather than merely smaller: the repository
# holds source, and the built site never enters git history at all.
#
# One manual step goes with this file: Settings > Pages > Source must be set to
# "GitHub Actions". While it still says "Deploy from a branch", this workflow
# runs and its output is ignored.

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

# Least privilege: read the code, write a Pages deployment, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but
# queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches ~/.npm keyed on the lockfile. Ketcher and three.js make a
          # cold install slow enough to be worth avoiding.
          cache: npm

      # `ci` rather than `install`: installs exactly the lockfile, and fails
      # instead of quietly resolving something newer.
      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Vite inlines these at build time, so they have to exist here or the
          # bundle ships with `undefined` and Supabase never initialises.
          #
          # Secrets for hygiene rather than secrecy: the publishable key is in
          # the public bundle either way, and RLS is what actually authorises.
          # The point is that the value is not in git history, so it can be
          # rotated without a commit.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APPS_SCRIPT_ENDPOINT: ${{ secrets.VITE_APPS_SCRIPT_ENDPOINT }}
          # AdSense ids (public). Unset secrets build as empty, which means no ads.
          VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT: ${{ secrets.VITE_ADSENSE_SLOT }}

      # The gate (owner 2026-10-20: tests now, budgets later). It runs after the
      # build because the engine packages load from their compiled dist/. A
      # failing test fails the job, so nothing deploys.
      #
      # Some tests (the guide RDKit byte-match checks) and the validator oracle
      # call Python with RDKit, pinned to the version
      # packages/validators/python/CONTRACT.md records.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # py2opsin turns names into structures for the unit generator scripts the
      # tests rerun byte for byte (u0_pools.py and others); it runs OPSIN on Java.
      # Versions match the owner's machine.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install rdkit==2026.3.5 py2opsin==1.2.0

      # The one exclusion is owner-acknowledged: src/game/test/bootLoader.test.ts
      # is red on purpose pending an owner decision, see
      # documentation/BOOT-LOADER-BLOCKER.md. Remove the flag when that resolves.
      # Nothing else is excluded.
      - name: Tests
        run: npm test -- --exclude src/game/test/bootLoader.test.ts

      # NOT YET ON. The validator CLI (suite integrity against validators.lock.json,
      # then every check, budgets included: chem-core 150 KB, game route 400 KB,
      # Ketcher isolation) joins the gate once the owner regenerates
      # validators.lock.json and the game route is under its limit. Uncomment then:
      # - name: Validators and budgets
      #   run: npm run validate -w packages/validators

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
